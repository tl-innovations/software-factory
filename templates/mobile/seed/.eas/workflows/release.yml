# Store release: build both platforms with the production profile, then submit both.
# Run it by hand:  npx eas-cli@latest workflow:run .eas/workflows/release.yml
# or from CI by setting FACTORY_EAS_RELEASE_ON_MAIN=true (see .github/workflows/factory-ci.yml).
# Docs: https://docs.expo.dev/eas/workflows/get-started/
name: Release to stores

jobs:
  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit to Google Play
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}

  submit_ios:
    name: Submit to App Store Connect
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
