# CI for the factory itself (not reusable). It keeps the templates, plugins and CLI healthy before
# `factory sync` sends them to every product.
name: factory-self-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Unit + hook tests
        run: npm test

      - name: Install Claude Code (for `claude plugin validate`)
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate factory
        run: node scripts/factory.mjs validate

      - name: Lint workflows (actionlint, official image)
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color
