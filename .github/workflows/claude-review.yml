# Reusable: Claude PR review that posts inline comments plus one summary comment.
# Based on anthropics/claude-code-action examples/pr-review-comprehensive.yml.
name: claude-review (reusable)

on:
  workflow_call:
    inputs:
      model:
        type: string
        default: sonnet
      max-turns:
        type: number
        default: 25
      extra-instructions:
        description: Appended to the review prompt (product-specific focus areas)
        type: string
        default: ""
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    concurrency:
      group: factory-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the software factory's reviewer for this product. Read CLAUDE.md and
            .factory/standards.md first. If the PR description links a spec in docs/specs/,
            read it and check the change against its acceptance criteria.

            Review only the changes in this PR (`gh pr diff`). Look for, in priority order:
            1. Correctness bugs and unmet acceptance criteria
            2. Security and privacy problems (secrets, injection, missing authorization, data exposure)
            3. Missing or weak tests for the changed behaviour
            4. Accessibility (web) or platform/OTA-safety issues (mobile)
            5. Violations of the factory standards

            Rules:
            - Don't comment on formatting or style that a linter would catch.
            - Use inline comments (mcp__github_inline_comment__create_inline_comment) only for
              concrete, actionable problems, and say why each one matters.
            - Finish with ONE summary comment (`gh pr comment`) containing a verdict:
              "Ready for human review", "Needs changes", or "Blocked", plus a short list of findings
              by severity. If you found nothing significant, say so in one line.
            - You are advisory. A human makes the merge decision.

            ${{ inputs.extra-instructions }}
          claude_args: |
            --model ${{ inputs.model }} --max-turns ${{ inputs.max-turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
